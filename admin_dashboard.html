<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Marathon Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Sarabun', sans-serif; background: #080808; color: #fff; padding: 24px 20px; min-height: 100vh; }
.top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; flex-wrap: wrap; gap: 10px; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 18px; }
.top-title { font-family: 'Orbitron', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
.top-sub { font-size: 11px; color: rgba(255,255,255,0.3); margin-top: 4px; letter-spacing: 0.08em; }
.live-badge { background: transparent; border: 1px solid #4ade80; color: #4ade80; font-size: 11px; font-weight: 700; padding: 4px 14px; letter-spacing: .1em; font-family: 'Orbitron', sans-serif; display: flex; align-items: center; gap: 6px; }
.dot { width: 6px; height: 6px; background: #4ade80; display: inline-block; animation: bl 1.4s infinite; }
@keyframes bl { 0%,100%{opacity:1} 50%{opacity:.2} }
.minimap-section { background: #111; border: 1px solid rgba(255,255,255,0.07); border-top: 3px solid #FFDD00; padding: 18px; margin-bottom: 24px; }
.minimap-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.minimap-title { font-family: 'Orbitron', sans-serif; font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase; }
.minimap-meta { font-family: 'Orbitron', sans-serif; font-size: 10px; letter-spacing: 0.15em; color: #FFDD00; }
.minimap-wrap { background: #0a0a0a; border: 1px solid rgba(255,255,255,0.04); padding: 12px; border-radius: 4px; }
svg.race-map { display: block; width: 100%; height: auto; max-height: 500px; }
.route-shape { fill: none; stroke: #FF820D; stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 6px rgba(255,221,0,0.3)); }
.start-finish-line { stroke: #fff; stroke-width: 6; }
.runner-dot { transition: transform 1.5s cubic-bezier(.4,0,.2,1); }
.runner-dot circle { stroke: #fff; stroke-width: 4; filter: drop-shadow(0 0 12px var(--rdot)); }
.runner-dot text { font-family: 'Orbitron', sans-serif; font-size: 24px; font-weight: 700; fill: #000; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; margin-bottom: 28px; }
.runner-card { background: #111111; border: 1px solid rgba(255,255,255,0.07); border-top: 3px solid var(--card-color, #4ade80); padding: 16px; }
.card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.rank-badge { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; font-family: 'Orbitron', sans-serif; background: var(--card-color, #4ade80); color: #000; flex-shrink: 0; }
.runner-name { font-size: 15px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
.runner-sub { font-size: 11px; color: rgba(255,255,255,0.3); margin-top: 3px; letter-spacing: 0.04em; }
.bar-wrap { height: 6px; background: rgba(255,255,255,0.07); margin-bottom: 8px; overflow: hidden; }
.bar-fill { height: 100%; transition: width 1s ease; background: var(--card-color, #4ade80); }
.km-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 16px; }
.km-main { font-weight: 800; font-family: 'Orbitron', sans-serif; font-size: 14px; }
.km-of { color: rgba(255,255,255,0.3); font-size: 12px; }
.controls { border-top: 1px solid rgba(255,255,255,0.05); padding-top: 14px; display: grid; gap: 10px; }
.ctrl-label { font-size: 10px; color: rgba(255,255,255,0.35); text-transform: uppercase; letter-spacing: .1em; font-weight: 700; display: block; margin-bottom: 6px; }
.ctrl-row { display: flex; gap: 8px; }
.ctrl-row input { flex: 1; padding: 8px 10px; background: #080808; border: 1px solid rgba(255,255,255,0.1); color: #fff; font-size: 14px; font-family: 'Sarabun', sans-serif; outline: none; }
.ctrl-row input:focus { border-color: var(--card-color, #4ade80); }
.btn-set { padding: 8px 14px; border: 1px solid rgba(255,255,255,0.15); background: transparent; color: #fff; font-size: 12px; font-weight: 700; font-family: 'Orbitron', sans-serif; cursor: pointer; letter-spacing: 0.05em; white-space: nowrap; transition: background 0.15s, border-color 0.15s; }
.btn-set:hover { background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.3); }
.btn-set.alt { border-color: var(--card-color,#4ade80); color: var(--card-color,#4ade80); }
.btn-set.alt:hover { background: rgba(255,255,255,0.05); }
.btn-set.danger { border-color: #ef4444; color: #ef4444; }
.btn-set.danger:hover { background: rgba(239,68,68,0.08); }
.color-toggle-btn { width: 100%; padding: 7px 12px; background: transparent; border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.5); font-size: 11px; font-family: 'Orbitron', sans-serif; letter-spacing: 0.1em; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 8px; transition: border-color 0.15s; }
.color-toggle-btn:hover { border-color: var(--card-color,#4ade80); color: #fff; }
.color-toggle-btn .swatch-preview { width: 12px; height: 12px; background: var(--card-color, #4ade80); display: inline-block; flex-shrink: 0; }
.color-panel { display: none; padding: 10px; background: #080808; border: 1px solid rgba(255,255,255,0.07); border-top: none; }
.color-panel.open { display: block; }
.color-palette { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.color-swatch { aspect-ratio: 1; cursor: pointer; border: 2px solid transparent; transition: all 0.15s; position: relative; }
.color-swatch:hover { transform: scale(1.1); }
.color-swatch.active { border-color: #fff; }
.color-swatch.active::after { content: '✓'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #000; font-weight: 800; font-size: 13px; }
.gps-badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: 'Orbitron', sans-serif; font-size: 9px;
  letter-spacing: 0.1em; padding: 3px 8px;
  border: 1px solid; margin-left: auto;
}
.gps-badge.online { color: #4ade80; border-color: rgba(74,222,128,0.35); }
.gps-badge.offline { color: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.1); }
.gps-badge .bdot { width: 5px; height: 5px; border-radius: 50%; }
.gps-badge.online .bdot { background: #4ade80; animation: bl 1.4s infinite; }
.gps-badge.offline .bdot { background: rgba(255,255,255,0.2); }
.section-title { font-family: 'Orbitron', sans-serif; font-size: 11px; color: rgba(255,255,255,0.3); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 10px; }
.log-box { background: #111; border: 1px solid rgba(255,255,255,0.06); padding: 12px 16px; font-size: 12px; color: rgba(255,255,255,0.4); line-height: 2; max-height: 160px; overflow-y: auto; font-family: monospace; }
.log-entry { border-bottom: 1px solid rgba(255,255,255,0.03); padding-bottom: 2px; }
.log-entry:last-child { border-bottom: none; }
.conn-status { text-align: center; font-size: 11px; color: rgba(255,255,255,0.2); margin-top: 14px; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="top">
  <div>
    <div class="top-title">Marathon Admin</div>
    <div class="top-sub">ติดตาม 4 นักวิ่ง · ตั้งสีและระยะเป้าหมาย</div>
  </div>
  <div style="display:flex;gap:10px;align-items:center;">
    <button onclick="initRunners()" style="background:transparent;border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.4);font-family:'Orbitron',sans-serif;font-size:10px;letter-spacing:0.1em;padding:4px 12px;cursor:pointer;text-transform:uppercase;transition:all 0.15s;" onmouseover="this.style.borderColor='#fff';this.style.color='#fff'" onmouseout="this.style.borderColor='rgba(255,255,255,0.15)';this.style.color='rgba(255,255,255,0.4)'">INIT RUNNERS</button>
    <div class="live-badge"><span class="dot"></span>LIVE</div>
  </div>
</div>

<div class="minimap-section">
  <div class="minimap-header">
    <div class="minimap-title">Race Map · Live Tracking</div>
    <div class="minimap-meta">BANGSAEN10 · 10 KM</div>
  </div>
  <div class="minimap-wrap">
    <svg class="race-map" viewBox="0 0 1728 1296" xmlns="http://www.w3.org/2000/svg">
      <path id="roadShape" class="route-shape"
        d="M848.61,306.37c-1.32,11.32-4.68,22.25-6.13,33.58c-1.57,12.24-3.35,24.27-0.6,36.64c1.74,7.83,1.89,16.01,3.19,23.96c2.2,13.43,5.09,26.76,6.98,40.23c0.87,6.18,1.63,12.39,2.41,18.59c1.41,11.08,3.49,22.02,5.46,32.99c0.63,3.51,0.09,7.17,0.55,10.8c0.46,3.61-2.42,5.78-5.31,7.1c-2.98,1.35-6.14,2.64-9.55,2.47c-9.95-0.49-16.6,4.54-21.6,12.6c-9.42,15.16-22.65,26.34-38.45,34c-10.2,4.94-21.48,6.02-32.25,0.75c-9.19-4.5-18.56-4.08-28.21-2.38c-10.37,1.82-20.65,3.89-29.95,9.07c-9.18,5.11-16.85,12.18-23.94,19.82c-2.67,2.88-3.41,6.74-3.72,10.74c-1.07,13.74,4.39,24.79,13.19,34.85c8.98,10.27,17.64,20.81,25.96,31.65c7.14,9.29,16.71,15.42,28,19.45c20,7.15,36.94,19.42,52.21,34.04c2.04,1.95,3.91,4.1,6.02,5.97c5.33,4.74,10.6,9.18,18.57,9.23c4.07,0.03,7.99,2.18,11.46,5.1c16.6,13.96,30.66,30.52,46.56,45.22c14.83,13.71,28.43,28.73,42.73,43.02c17.9,17.89,36.03,35.54,53.92,53.44c16.09,16.09,32.15,32.22,47.94,48.61c16.97,17.62,34.02,35.19,50.29,53.45c16.89,18.95,33.14,38.49,49.21,58.15c18.33,22.42,37.28,44.31,55.68,66.66c20.95,25.45,42.44,50.47,62.63,76.57c6.5,8.4,14.23,15.86,20.24,24.71c1.81,2.66,4.3,2.76,7.2,3.1c14.46,1.69,27.01-3.85,39.6-9.68c14.93-6.92,29.97-13.63,44.95-20.43c0.41-0.18,0.8-0.41,1.2-0.6c8.39-3.93,9.44-6.63,4.1-13.73c-4.76-6.33-10.28-12.08-15.5-18.06c-13.98-16.01-28.06-31.92-41.94-48.02c-13.71-15.9-27.17-32-40.8-47.96c-14.55-17.03-28.83-34.31-43.84-50.93c-21.86-24.19-42.54-49.4-64.01-73.92c-20.27-23.15-39.96-46.8-60.04-70.12c-19.69-22.88-39.53-45.63-59.34-68.4c-13.95-16.03-28.09-31.9-41.93-48.03c-15.33-17.87-30.28-36.08-45.64-53.93c-14.41-16.75-29.19-33.19-43.71-49.84c-9.88-11.32-19.47-22.9-29.45-34.13c-5.23-5.89-4.3-11.59-0.52-17.43c7.52-11.6,13.56-24.02,20.32-36.03c12.12-21.53,24.14-43.11,35.95-64.8c5.03-9.25,13.83-11.33,22.85-13.12c9.09-1.8,18.35-1.56,27.57-1.94c19.86-0.8,39.74-2.01,58.14-10.76c4.67-2.22,9.36-4.2,12.2-9.45c2.79-5.15-0.71-10.42-6.78-10.2c-3.79,0.14-7.5,1.39-10.8,3.49c-2.57,1.64-5.05,3.54-7.81,4.75c-11.64,5.07-19.31,3.37-25.13-7.15c-12.63-22.83-23.58-46.45-32.99-70.78c-6.01-15.56-11.42-31.4-19.32-46.12c-4.07-7.59-9.45-14.48-14.27-21.66c-10.26-15.29-18.88-31.5-26.91-48.03c-2.66-5.48-1.99-11.77-1.03-17.33c2.54-14.76,5.61-29.43,6.34-44.43c0.47-9.72-3.86-17.82-9.6-25.17c-11.18-14.32-22.7-28.32-37.09-39.68c-4.34-3.43-7.83-7.79-10.88-12.51c-4.68-7.24-9.09-7.22-13.73-0.02c-6.34,9.86-9.23,20.39-8.02,32.4c1.03,10.19,1.02,20.41,3,30.62c2.63,13.57,6.53,26.79,10.02,40.1c3.3,12.57,7.7,24.9,13.41,36.73c1.99,4.12,2.72,9.08,3.04,13.73c0.79,11.2-0.3,22.4-1.04,33.59c-0.1,1.57-1.91,2.49-1.25,4.2"/>
      <path id="centerPath" fill="none" stroke="none"/>
      <line x1="1001.44" y1="935.56" x2="1021.77" y2="915.23" stroke="#fff" stroke-width="6"/>
      <g id="mapRunners"></g>
    </svg>
  </div>
</div>

<div class="grid" id="grid"></div>
<div class="section-title">ประวัติการอัปเดต</div>
<div class="log-box" id="logBox">รอข้อมูล...</div>
<div class="conn-status" id="connStatus">กำลังเชื่อมต่อ Firebase...</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyB9RxP_jFuecXLyT7szJMnQYywIeVuqk34",
  authDomain: "marathon-tracker-f7e06.firebaseapp.com",
  databaseURL: "https://marathon-tracker-f7e06-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "marathon-tracker-f7e06",
  storageBucket: "marathon-tracker-f7e06.firebasestorage.app",
  messagingSenderId: "217799472779",
  appId: "1:217799472779:web:0cb0a05d3768059de5c68e",
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const PALETTE = ['#FACC15','#EC4899','#22D3EE','#A855F7','#10ff49','#F97316','#EF4444','#FFFFFF','#3B82F6','#06B6D4','#F59E0B','#84CC16'];
const DEFAULT_COLORS = ['#FACC15','#EC4899','#22D3EE','#A855F7'];

const ns = 'http://www.w3.org/2000/svg';
const svgEl = document.querySelector('svg.race-map');
const roadEl = document.getElementById('roadShape');
const dAttr = roadEl.getAttribute('d');

function samplePath(pathEl,n) { const total=pathEl.getTotalLength(),pts=[]; for(let i=0;i<n;i++){const pt=pathEl.getPointAtLength((i/(n-1))*total);pts.push({x:pt.x,y:pt.y});}return pts; }
function dist2(a,b){const dx=a.x-b.x,dy=a.y-b.y;return dx*dx+dy*dy;}
function ptsToPath(pts){if(!pts.length)return'';let d=`M ${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)}`;for(let i=1;i<pts.length;i++)d+=` L ${pts[i].x.toFixed(1)},${pts[i].y.toFixed(1)}`;return d;}

// เส้น 10K มีเส้นเดียว ใช้ roadShape โดยตรง
const N = 600;
const outerPts = samplePath(roadEl, N);
let centerPts = outerPts.slice();

// หาจุดเริ่มต้นที่ใกล้ finish line (1011, 925)
const START_TARGET = {x:1011, y:925};
let bestIdx=0, bestD=Infinity;
for(let i=0;i<centerPts.length;i++){const d=dist2(centerPts[i],START_TARGET);if(d<bestD){bestD=d;bestIdx=i;}}
const rotated = centerPts.slice(bestIdx).concat(centerPts.slice(0,bestIdx));
rotated.push(rotated[0]);

const centerPath = document.getElementById('centerPath');
centerPath.setAttribute('d', ptsToPath(rotated));
const totalLength = centerPath.getTotalLength();

const TOTAL_KM = 10;
function kmToPoint(km){return centerPath.getPointAtLength((Math.min(TOTAL_KM,Math.max(0,km))/TOTAL_KM)*totalLength);}

const mapRunnersGroup = document.getElementById('mapRunners');
function ensureMapDot(idx,color){let dot=document.getElementById('mapDot-'+idx);if(!dot){dot=document.createElementNS(ns,'g');dot.classList.add('runner-dot');dot.id='mapDot-'+idx;dot.innerHTML=`<circle r="28" fill="${color}"/><text>${idx+1}</text>`;mapRunnersGroup.appendChild(dot);}else{dot.querySelector('circle').setAttribute('fill',color);}dot.style.setProperty('--rdot',color);return dot;}
function updateMapDot(idx,km,color,goal){const pt=kmToPoint(Math.min(km,goal));const dot=ensureMapDot(idx,color);dot.setAttribute('transform',`translate(${pt.x},${pt.y})`);}

const logs=[];
function addLog(msg){const t=new Date().toLocaleTimeString('th-TH');logs.unshift('['+t+'] '+msg);if(logs.length>30)logs.pop();document.getElementById('logBox').innerHTML=logs.map(l=>`<div class="log-entry">${l}</div>`).join('');}

window.manualSet=function(key){const val=parseFloat(document.getElementById('inp_'+key).value);const goal=parseFloat(document.getElementById('goalInp_'+key).value)||10;if(isNaN(val)||val<0||val>goal){alert('ใส่ตัวเลข 0–'+goal+' กม.');return;}const name=(window._cur[key]||{}).name||key;set(ref(db,'runners/'+key+'/km'),parseFloat(val.toFixed(2)));addLog(`[Manual] ${name} → ${val.toFixed(2)} กม.`);};

window.setGoal=function(key){const val=parseFloat(document.getElementById('goalInp_'+key).value);if(isNaN(val)||val<1||val>200){alert('ใส่เป้าหมาย 1–200 กม.');return;}const name=(window._cur[key]||{}).name||key;set(ref(db,'runners/'+key+'/goal'),val);addLog(`[Goal] ${name} → ${val} กม.`);};

window.resetKm=function(key){const name=(window._cur[key]||{}).name||key;if(!confirm(`Reset "${name}" เป็น 0 กม.?`))return;set(ref(db,'runners/'+key+'/km'),0);addLog(`[Reset] ${name} → 0 กม.`);};

window.initRunners=async function(){if(!confirm('สร้างข้อมูลเริ่มต้นทั้ง 4 คน? (จะ reset km เป็น 0)'))return;const defaults=[{name:'Runner 1',goal:10,color:'#FACC15'},{name:'Runner 2',goal:10,color:'#EC4899'},{name:'Runner 3',goal:10,color:'#22D3EE'},{name:'Runner 4',goal:10,color:'#A855F7'}];for(let i=0;i<4;i++){const key='runner'+(i+1),existing=(window._cur[key]||{});await set(ref(db,'runners/'+key),{name:existing.name||defaults[i].name,goal:existing.goal||defaults[i].goal,color:existing.color||defaults[i].color,km:0});}addLog('[Init] สร้างข้อมูลนักวิ่ง 4 คนเรียบร้อย');};

window.setName=function(key){const val=document.getElementById('nameInp_'+key).value.trim();if(!val){alert('ใส่ชื่อนักวิ่งด้วยครับ');return;}set(ref(db,'runners/'+key+'/name'),val);addLog(`[Name] runner${key.slice(-1)} → ${val}`);};

window.setColor=function(key,color){set(ref(db,'runners/'+key+'/color'),color);const name=(window._cur[key]||{}).name||key;addLog(`[Color] ${name} → ${color}`);};

window.toggleColor=function(key){document.getElementById('colorPanel_'+key).classList.toggle('open');};

window._cur={};

function isOnline(data){return data && data.lastSeen && (Date.now() - data.lastSeen) < 15000;}

function renderCard(key,data,idx){
  const km=data.km||0,goal=data.goal||10,name=data.name||('นักวิ่ง '+(idx+1)),color=data.color||DEFAULT_COLORS[idx];
  const pct=Math.min(100,(km/goal)*100),acc=data.acc?'±'+data.acc+'ม.':'—';
  const swatches=PALETTE.map(c=>`<div class="color-swatch ${c.toLowerCase()===color.toLowerCase()?'active':''}" style="background:${c}" onclick="setColor('${key}','${c}')" title="${c}"></div>`).join('');
  const online = isOnline(data);
  const badge = `<div class="gps-badge ${online?'online':'offline'}" id="gpsBadge_${key}"><span class="bdot"></span><span class="btext">${online?'LIVE':'OFFLINE'}</span></div>`;

  return `
  <div class="runner-card" style="--card-color:${color}">
    <div class="card-header">
      <div class="rank-badge">${idx+1}</div>
      <div><div class="runner-name">${name}</div><div class="runner-sub">GPS: ${acc}</div></div>
      ${badge}
    </div>
    <div class="bar-wrap"><div class="bar-fill" style="width:${pct.toFixed(1)}%"></div></div>
    <div class="km-row">
      <span class="km-main">${km.toFixed(2)} KM</span>
      <span class="km-of">/ ${goal} km · ${pct.toFixed(0)}%</span>
    </div>
    <div class="controls">
      <div>
        <span class="ctrl-label">ชื่อนักวิ่ง</span>
        <div class="ctrl-row">
          <input type="text" id="nameInp_${key}" placeholder="${name}" value="${name}">
          <button class="btn-set alt" onclick="setName('${key}')">SET</button>
        </div>
      </div>
      <div>
        <span class="ctrl-label">เป้าหมาย (กม.)</span>
        <div class="ctrl-row">
          <input type="number" id="goalInp_${key}" min="1" max="200" step="1" value="${goal}">
          <button class="btn-set alt" onclick="setGoal('${key}')">SET</button>
        </div>
      </div>
      <div>
        <span class="ctrl-label">แก้ระยะด้วยมือ</span>
        <div class="ctrl-row">
          <input type="number" id="inp_${key}" min="0" max="200" step="0.1" placeholder="${km.toFixed(1)}">
          <button class="btn-set" onclick="manualSet('${key}')">SET</button>
          <button class="btn-set danger" onclick="resetKm('${key}')">RESET</button>
        </div>
      </div>
      <div>
        <button class="color-toggle-btn" onclick="toggleColor('${key}')">
          <span class="swatch-preview" style="background:${color}"></span>
          OBS COLOR — ${color}
        </button>
        <div class="color-panel" id="colorPanel_${key}"><div class="color-palette">${swatches}</div></div>
      </div>
    </div>
  </div>`;
}

let prevKm={};
onValue(ref(db,'runners'),snap=>{
  const data=snap.val()||{};
  window._cur=data;
  let html='';
  for(let i=0;i<4;i++){
    const key='runner'+(i+1),r=data[key]||{};
    if(prevKm[key]!==undefined&&Math.abs((r.km||0)-prevKm[key])>0.01){addLog(`[GPS] ${r.name||key} → ${(r.km||0).toFixed(2)} กม.`);}
    prevKm[key]=r.km||0;
    html+=renderCard(key,r,i);
    updateMapDot(i,r.km||0,r.color||DEFAULT_COLORS[i],r.goal||10);
  }
  document.getElementById('grid').innerHTML=html;
  document.getElementById('connStatus').textContent='เชื่อมต่อ Firebase · อัปเดตอัตโนมัติ';
});

setInterval(() => {
  const data = window._cur || {};
  for (let i = 0; i < 4; i++) {
    const key = 'runner'+(i+1);
    const badge = document.getElementById('gpsBadge_'+key);
    if (!badge) continue;
    const online = isOnline(data[key]);
    badge.classList.toggle('online', online);
    badge.classList.toggle('offline', !online);
    const txt = badge.querySelector('.btext');
    if (txt) txt.textContent = online ? 'LIVE' : 'OFFLINE';
  }
}, 3000);
</script>
</body>
</html>
